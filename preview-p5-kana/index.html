<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <meta name="robots" content="noindex,nofollow" />
    <title>コトネクト</title>
    <style>
      /*
       * 起動画面（FB-002・2026-07-29）。旧版は1.3秒で切り替わり「急すぎて雑」との指摘を受けた。
       * 暗い画面でASTERISMを見せる → 文字だけゆっくり薄く消す → 黒のまま一拍おく →
       * 全体を透かしてタイトルへ、の順にする。
       * 白を挟む案は取りやめ、元の黒背景をそのまま活かすブラックアウトにした
       * （ようすけ訂正・2026-07-29）。テンポは急がず、各段階をゆっくり送る。
       * 数値はようすけの実機体感で最終決定する。
       */
      #asterism-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #090b13;
        color: #e8fbff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", sans-serif;
        font-size: clamp(1.15rem, 5vw, 1.65rem);
        font-weight: 700;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        opacity: 1;
        transition: opacity 900ms ease;
      }

      /* 文字だけをゆっくり消す。背景は黒のまま動かさない。 */
      #asterism-splash.is-fading {
        pointer-events: none;
      }

      /* 文字は最初は見えない。黒の中央からゆっくり浮かび上がる。 */
      #asterism-splash .splash-word {
        display: block;
        opacity: 0;
        transition: opacity 1150ms ease-in;
      }

      #asterism-splash.is-word-in .splash-word {
        opacity: 1;
      }

      /* 浮かび上がる時よりさらにゆっくり薄くなって消える。 */
      #asterism-splash.is-fading .splash-word {
        opacity: 0;
        transition-duration: 1350ms;
        transition-timing-function: ease-out;
      }

      /* 黒いまま全体を透かし、背後のタイトルへつなぐ。 */
      #asterism-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      /*
       * 起動画面のフェードは、動きを減らす設定でも短縮しない。変化するのは透明度だけで
       * 視差や大きな移動を伴わないため。旧版は1msへ潰しており、その設定を入れている
       * 端末では切り替わりが一瞬になって「雑」に見えていた。
       */
    </style>
    <script type="module" crossorigin src="/yofuke-works-public/preview-p5-kana/assets/index-Bim74Fv6.js"></script>
    <link rel="stylesheet" crossorigin href="/yofuke-works-public/preview-p5-kana/assets/index-CZyNGvAp.css">
  </head>
  <body>
    <div id="asterism-splash" role="img" aria-label="アステリズム">
      <span class="splash-word">ASTERISM</span>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById("asterism-splash");
        if (!splash) return;
        // ようすけ指定の順序（2026-07-29）:
        //   黒い画面の中央にASTERISMが浮かび上がる → ゆっくり薄くなって消える
        //   → 完全な黒で少しだけ余韻 → タイトル画面へ移行。
        // 段階の時間は端末設定で短縮しない。変化するのは透明度だけで、視差や
        // 大きな移動を伴わないため速める理由がない。
        var fadeInMs = 1150;   // 浮かび上がる
        var holdWord = 1200;   // 名前を見せる
        var fadeOutMs = 1350;  // ゆっくり消える
        var holdBlack = 750;   // 完全な黒の余韻
        var leaveMs = 850;     // タイトルへ移行
        // 初期状態を確実に描画させてから遷移を始める（でないと即座に表示される）。
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            splash.classList.add("is-word-in");
          });
        });
        window.setTimeout(function () {
          splash.classList.add("is-fading");
          window.setTimeout(function () {
            splash.classList.add("is-leaving");
            window.setTimeout(function () {
              splash.remove();
            }, leaveMs);
          }, fadeOutMs + holdBlack);
        }, fadeInMs + holdWord);
      })();
    </script>
  </body>
</html>
