<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <meta name="robots" content="noindex,nofollow" />
    <!--
      独立QA L-2（2026-07-30）: favicon.ico が404でコンソールエラーが1件出ていた。
      外部ファイルを増やさず、同梱のSVGをdata URIで直接置く（ことばを繋ぐ意匠）。
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230c0a1b'/%3E%3Cpath%20d='M16%2032h32'%20stroke='%23ff2e88'%20stroke-width='5'%20stroke-linecap='round'/%3E%3Ccircle%20cx='16'%20cy='32'%20r='8'%20fill='%2300e5ff'/%3E%3Ccircle%20cx='48'%20cy='32'%20r='8'%20fill='%2300e5ff'/%3E%3C/svg%3E" />
    <title>コトネクト</title>
    <style>
      /*
       * 起動画面（FB-002・2026-07-29）。旧版は1.3秒で切り替わり「急すぎて雑」との指摘を受けた。
       * 暗い画面でASTERISMを見せる → 文字だけゆっくり薄く消す → 黒のまま一拍おく →
       * 全体を透かしてタイトルへ、の順にする。
       * 白を挟む案は取りやめ、元の黒背景をそのまま活かすブラックアウトにした
       * （ようすけ訂正・2026-07-29）。テンポは急がず、各段階をゆっくり送る。
       * 数値はようすけの実機体感で最終決定する。
       */
      #asterism-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #090b13;
        color: #e8fbff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", sans-serif;
        font-size: clamp(1.15rem, 5vw, 1.65rem);
        font-weight: 700;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        opacity: 1;
        transition: opacity 900ms ease;
      }

      /* 文字だけをゆっくり消す。背景は黒のまま動かさない。 */
      #asterism-splash.is-fading {
        pointer-events: none;
      }

      /* 文字は最初は見えない。黒の中央からゆっくり浮かび上がる。 */
      #asterism-splash .splash-word {
        /* 商品画像を追加しても別のグリッド行へ押し上げない。常に画面中央の同じセル。 */
        grid-area: 1 / 1;
        display: block;
        opacity: 0;
        transition: opacity 1150ms ease-in;
      }

      #asterism-splash.is-word-in .splash-word {
        opacity: 1;
      }

      /* 浮かび上がる時よりさらにゆっくり薄くなって消える。 */
      #asterism-splash.is-fading .splash-word {
        opacity: 0;
        transition-duration: 1350ms;
        transition-timing-function: ease-out;
      }

      /* 商品イメージの段階では、ASTERISMの文字を場所ごと片付ける。 */
      #asterism-splash.is-package .splash-word {
        display: none;
      }

      /*
       * 起動画面のフェードは、動きを減らす設定でも短縮しない。変化するのは透明度だけで
       * 視差や大きな移動を伴わないため。旧版は1msへ潰しており、その設定を入れている
       * 端末では切り替わりが一瞬になって「雑」に見えていた。
       */

      /*
       * 商品イメージとSTART（ようすけさん設計・2026-07-31）。
       * ASTERISMが消えたあと商品イメージを見せ、1.5秒後にSTARTを出す。
       * STARTを押すと2秒かけてブラックアウトしてタイトルへ渡す。
       *
       * STARTは「最初のユーザー操作」でもある。iOSは操作の外で音を出せないため、
       * この一押しがBGM再生の起点になる（main.tsx の bindBgmToFirstGesture）。
       */
      #asterism-splash .splash-stage {
        /* ASTERISMと同じ中央セルを全画面で覆う。透明時にもASTERISMを上へ押さない。 */
        grid-area: 1 / 1;
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        opacity: 0;
        transition: opacity 900ms ease-in;
        pointer-events: none;
      }

      #asterism-splash.is-package .splash-stage {
        opacity: 1;
        pointer-events: auto;
      }

      #asterism-splash .splash-package-art {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      #asterism-splash .splash-start {
        /* 商品ビジュアルの中央へ重ね、光だけで浮かび上がらせる。 */
        position: absolute;
        z-index: 1;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        /* 押せることが分かる大きさ。最小タップ寸法を必ず満たす。 */
        min-width: 12rem;
        min-height: 56px;
        padding: 0.7rem 2.4rem;
        border: 2px solid #00e5ff;
        border-radius: 999px;
        background: #00e5ff;
        color: #0c0a1b;
        font-family: inherit;
        font-size: clamp(1rem, 4.4vw, 1.25rem);
        font-weight: 800;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        cursor: pointer;
        opacity: 0;
        transition: opacity 700ms ease-in;
        /* 動きは光の強弱だけ。位置は動かさない（視差を作らない）。 */
        animation: splash-start-pulse 2.4s ease-in-out infinite;
      }

      #asterism-splash.is-start-ready .splash-start {
        opacity: 1;
        pointer-events: auto;
      }

      @keyframes splash-start-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(0, 229, 255, 0.45); }
        50% { box-shadow: 0 0 26px rgba(0, 229, 255, 0.95); }
      }

      /* 動きを減らす設定でも止めない。光の振れ幅を小さく、周期をゆっくりにする。 */
      @keyframes splash-start-pulse-reduced {
        0%, 100% { box-shadow: 0 0 12px rgba(0, 229, 255, 0.45); }
        50% { box-shadow: 0 0 17px rgba(0, 229, 255, 0.62); }
      }

      @media (prefers-reduced-motion: reduce) {
        #asterism-splash .splash-start {
          animation: splash-start-pulse-reduced 4.8s ease-in-out infinite;
        }
      }

      /* STARTのあと、2秒かけて黒へ沈める。背景は黒のまま動かさない。 */
      #asterism-splash.is-blackout .splash-stage {
        opacity: 0;
        pointer-events: none;
        transition: opacity 2000ms ease-in-out;
      }
    </style>
    <script type="module" crossorigin src="/yofuke-works-public/preview-p5-kana/assets/index-R2JPtseB.js"></script>
  </head>
  <body>
    <div id="asterism-splash">
      <span class="splash-word" role="img" aria-label="アステリズム">ASTERISM</span>
      <div class="splash-stage">
        <img
          class="splash-package-art"
          src="/yofuke-works-public/preview-p5-kana/assets/kotonect-launch-portrait-v1-BgY_qCpt.webp"
          alt="コトネクトの起動ビジュアル"
          width="853"
          height="1844"
          decoding="async"
        />
        <button type="button" class="splash-start" id="splash-start">START</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById("asterism-splash");
        if (!splash) return;
        // ようすけ指定の順序（2026-07-29）:
        //   黒い画面の中央にASTERISMが浮かび上がる → ゆっくり薄くなって消える
        //   → 完全な黒で少しだけ余韻 → タイトル画面へ移行。
        // 段階の時間は端末設定で短縮しない。変化するのは透明度だけで、視差や
        // 大きな移動を伴わないため速める理由がない。
        var fadeInMs = 1150;   // 浮かび上がる
        // 2026-07-31 ようすけさん指示: ASTERISMの表示を1秒短くする（1200→200）。
        // 短くするのはここだけ。消える動作と黒の余韻はFB-002のまま変えない。
        var holdWord = 200;    // 名前を見せる
        var fadeOutMs = 1350;  // ゆっくり消える
        var holdBlack = 750;   // 完全な黒の余韻
        // ここから2026-07-31に追加した段階。
        var startDelayMs = 1500;  // 商品イメージを出してからSTARTが現れるまで
        var blackoutMs = 2000;    // STARTのあと、黒へ沈むまで
        var startBtn = document.getElementById("splash-start");

        // 初期状態を確実に描画させてから遷移を始める（でないと即座に表示される）。
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            splash.classList.add("is-word-in");
          });
        });
        window.setTimeout(function () {
          splash.classList.add("is-fading");
          window.setTimeout(function () {
            // ASTERISMを片付け、商品イメージへ渡す。
            splash.classList.add("is-package");
            window.setTimeout(function () {
              splash.classList.add("is-start-ready");
            }, startDelayMs);
          }, fadeOutMs + holdBlack);
        }, fadeInMs + holdWord);

        // STARTは押されるまで待つ。押されたら2秒かけて黒へ沈め、タイトルへ渡す。
        // このクリックが「最初のユーザー操作」になり、BGMの再生起点も兼ねる。
        if (startBtn) {
          startBtn.addEventListener("click", function () {
            if (splash.classList.contains("is-blackout")) return;
            splash.classList.add("is-blackout");
            window.setTimeout(function () {
              splash.remove();
            }, blackoutMs);
          });
        }
      })();
    </script>
  </body>
</html>
