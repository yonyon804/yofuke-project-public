<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カズネクト 試作4（数の広場）</title>
<!--
  カズネクト 試作4 — 数の広場

  7度目の形。判定の履歴は README.md。要点だけ:
    1. 一本の式の穴埋め   → 総当たりが最適戦略
    2. 交差型             → 縦と横が独立していて道が繋がらない
    3〜6. 材料を使い切る道つなぎ → 6回作り直して「今一面白くない」（2026-08-14）

  試作3を測って分かった原因は**規模**だった。
  「簡単すぎる」を直すために記号も使い切りにしたが、記号は4つしか無いので
  盤面が4行で頭打ちになる。**難しくした仕組みが、盤面が育たない理由そのもの。**
  全10問を合わせても置く手は36個しか無かった。

  直し方は、希少さを盤面の大きさに比例させること。記号を各3回にすると12本まで伸びる。
  駅を3×3に並べて1〜9を1つずつ置くと、**駅が縦の道と横の道の両方に属する**。
  試作2が落ちた「縦と横が独立」を、共有する駅を増やすことで解く。

  確かめたいのは1点だけ。**盤面が3倍になって、消去法の連鎖が続くのが面白いか。**

  正解判定も計算もこの画面に無い。生成器が作った対応表を引くだけ（INC-2026-08-13-005）。
  見た目は `_nect-shared/nect.css`（コトネクトのアートディレクション）。
-->
<link rel="stylesheet" href="nect.css">
<style>
  /*
   * 広場。5列×5行の格子に、駅（偶数行・偶数列）と道（残り）を置く。
   *
   *   駅 道 駅 道 駅
   *   道    道    道
   *   駅 道 駅 道 駅
   *   道    道    道
   *   駅 道 駅 道 駅
   *
   * 1画面に収める（2026-08-13・ようすけさん実機報告への対応を継承）。
   * マスの大きさは画面の幅と高さの小さいほうに従わせ、はみ出す余地を盤面が吸収する。
   */
  .plaza {
    display: grid;
    grid-template-columns: repeat(var(--cols, 5), auto);
    gap: 0.2rem;
    justify-content: center;
    align-items: center;
    --cell: clamp(1.7rem, min(9.5vw, 5vh), 2.6rem);
  }
  .plaza .nect-tile {
    width: var(--cell); height: var(--cell);
    font-size: clamp(0.85rem, 4.4vw, 1.2rem);
    border-radius: 0.4rem;
  }
  /* まだ分かっていない駅。伏せてあるだけで、埋まる場所であることは見せる。 */
  .station--unknown { color: var(--dim); border-style: dashed; }
  /* 最初から見せてある駅（数独でいうヒントのマス）。 */
  .station--hint { border-color: var(--accent); }

  /*
   * 道1本。`記号` と `数` を並べて持つ。**道ごと1つの操作対象**にする。
   * 記号と数を別々のマスにすると、12本×2＝24個の的を選ぶことになり、
   * 小さい画面で押し分けられない。
   */
  .edge {
    display: flex; align-items: center; justify-content: center;
    gap: 0.1rem;
    min-width: calc(var(--cell) * 1.25);
    height: calc(var(--cell) * 0.86);
    padding: 0 0.15rem;
    border: 2px dashed var(--box-border);
    border-radius: 0.4rem;
    background: var(--box-bg);
    color: var(--accent);
    font-size: clamp(0.72rem, 3.6vw, 1rem);
    font-weight: 800;
    cursor: pointer;
    box-shadow: var(--bevel);
    transition: border-color var(--speed) ease, box-shadow var(--speed) ease;
  }
  .edge.is-filled { border-style: solid; }
  .edge.is-selected { border-color: var(--accent); animation: nect-breathe 1.6s ease-in-out infinite; }
  .edge__op { color: var(--accent); }
  .edge__num { color: var(--fg); }
  .edge__slot { color: var(--dim); opacity: 0.55; }
  .plaza .gap { width: 1px; height: 1px; }

  /* 材料。使ったら消える。残りが見えることが消去法の材料になる。 */
  .pool { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; align-items: center; }
  .pool-chip {
    min-width: 1.5rem; padding: 0.1rem 0.3rem; text-align: center;
    border: 1px solid var(--box-border); border-radius: 0.35rem;
    color: var(--fg); font-size: var(--fs-body); font-weight: 700;
  }
  .pool-chip.is-used { opacity: 0.25; text-decoration: line-through; }
  .pool-chip--op { color: var(--accent); display: inline-flex; align-items: baseline; gap: 0.15rem; }
  .pool-left { font-size: var(--fs-aux); font-weight: 600; color: var(--dim); }
  .pool-label { font-size: var(--fs-aux); color: var(--dim); }

  .nect-pad button:disabled { opacity: 0.25; cursor: default; }
</style>
</head>
<body>
<div class="nect-app">
  <header class="nect-header">
    <span id="progress"></span>
    <span id="band"></span>
  </header>

  <main class="nect-stage">
    <p class="nect-note" id="rule"></p>
    <div class="plaza" id="plaza"></div>
    <div class="pool" id="pool"></div>
    <div class="nect-msg" id="msg"></div>
  </main>

  <div class="nect-pad">
    <div class="nect-pad__row" id="row1"></div>
    <div class="nect-pad__row" id="row2"></div>
    <div class="nect-pad__row nect-pad__row--ops" id="row3"></div>
  </div>
  <div class="nect-actions">
    <button id="clear">この道を消す</button>
    <button id="next" class="is-primary">つぎの問題</button>
  </div>
</div>

<script src="plaza-puzzles.js"></script>
<script>
(function () {
  "use strict";
  const PUZZLES = window.KAZUNECT_PLAZA || [];
  const STEPS = window.KAZUNECT_STEPS || {};   // "元の数|記号|使う数" → 答え
  const OPS = ["+", "-", "×", "÷"];

  /*
   * 盤面の大きさは問題ごとに違う（初級2×3・中級2×4・上級3×3）。
   * **1手あたりの重さを人が数えられる大きさに固定したまま、長さで難易度を作る**
   * ため（2026-08-16。`tools/gen-plaza.mjs` 冒頭）。
   * 道の並びは生成器と同じ規則で作る。横をぜんぶ並べてから縦。
   */
  const edgesOf = (p) => {
    const E = [];
    for (let r = 0; r < p.rows; r++) for (let c = 0; c < p.cols - 1; c++) E.push([r * p.cols + c, r * p.cols + c + 1]);
    for (let c = 0; c < p.cols; c++) for (let r = 0; r < p.rows - 1; r++) E.push([r * p.cols + c, (r + 1) * p.cols + c]);
    return E;
  };
  const stationCount = (p) => p.rows * p.cols;
  const $ = (id) => document.getElementById(id);
  const glyph = (t) => (t === "-" ? "−" : t);

  let index = 0;
  let moves = [];       // 道の番号 → {op, operand} または null
  let selected = 0;     // いま入力対象の道
  let pendingOp = null;

  const puzzle = () => PUZZLES[index];

  /**
   * 各駅の数を求める。**置いた手から辿って決まる分だけ**を出す。
   *
   * 試作3で学んだこと: 「矛盾しない答えが1つに絞れたら全部見せる」ようにすると、
   * 数手置いた時点で盤面が残りを教えてしまう。数独は勝手にマスを埋めない。
   * 隣から辿って決まる分だけを出す。
   *
   * **計算はここでしない。** 生成器が渡した対応表を引くだけ（INC-2026-08-13-005）。
   */
  function stationValues() {
    const p = puzzle();
    const EDGES = edgesOf(p);
    const hi = stationCount(p);
    const known = new Array(hi).fill(null);
    for (const [i, v] of Object.entries(p.hints)) known[Number(i)] = v;

    for (let pass = 0; pass < EDGES.length; pass++) {
      let moved = false;
      EDGES.forEach(([a, b], e) => {
        const m = moves[e];
        if (!m) return;
        if (known[a] !== null && known[b] === null) {
          const to = STEPS[`${known[a]}|${m.op}|${m.operand}`];
          if (to !== undefined) { known[b] = to; moved = true; }
        }
        if (known[b] !== null && known[a] === null) {
          // 同じ手でその駅になる「元の数」を1〜(駅の数)から探す。複数あれば決まらない。
          const c = [];
          for (let x = 1; x <= hi; x++) {
            if (STEPS[`${x}|${m.op}|${m.operand}`] === known[b]) c.push(x);
          }
          if (c.length === 1) { known[a] = c[0]; moved = true; }
        }
      });
      if (!moved) break;
    }
    return known;
  }

  const remainingNums = () => {
    const rest = [...puzzle().pool];
    for (const m of moves) {
      if (!m) continue;
      const at = rest.indexOf(m.operand);
      if (at !== -1) rest.splice(at, 1);
    }
    return rest;
  };

  const remainingOps = () => {
    const left = Object.fromEntries(OPS.map((o) => [o, puzzle().quota[o] ?? 0]));
    for (const m of moves) if (m) left[m.op]--;
    return left;
  };

  function tile(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    return el;
  }

  function render() {
    const p = puzzle();
    $("progress").textContent = `問題 ${index + 1} / ${PUZZLES.length}`;
    $("band").textContent = p.band;
    $("rule").textContent = `駅は1〜${stationCount(p)}をひとつずつ。数はぜんぶ使い切る`;

    const plaza = $("plaza");
    plaza.innerHTML = "";
    const known = stationValues();
    const gRows = p.rows * 2 - 1, gCols = p.cols * 2 - 1;
    plaza.style.setProperty("--cols", String(gCols));

    // (駅の数×2-1) の格子へ、駅と道を置く。
    for (let gr = 0; gr < gRows; gr++) {
      for (let gc = 0; gc < gCols; gc++) {
        const r = gr / 2, c = gc / 2;
        let el;
        if (gr % 2 === 0 && gc % 2 === 0) {
          const s = r * p.cols + c;
          const v = known[s];
          const isHint = p.hints[s] !== undefined;
          el = tile("nect-tile " + (v === null ? "station--unknown"
            : "nect-tile--fixed" + (isHint ? " station--hint" : "")), v === null ? "?" : String(v));
        } else if (gr % 2 === 0) {
          el = edgeEl(r * (p.cols - 1) + (gc - 1) / 2);                        // 横の道
        } else if (gc % 2 === 0) {
          el = edgeEl(p.rows * (p.cols - 1) + c * (p.rows - 1) + (gr - 1) / 2); // 縦の道
        } else {
          el = tile("gap", "");
        }
        el.style.gridRow = gr + 1;
        el.style.gridColumn = gc + 1;
        plaza.appendChild(el);
      }
    }

    const pool = $("pool");
    pool.innerHTML = "";
    pool.appendChild(tile("pool-label", "数"));
    const rest = remainingNums();
    const restCopy = [...rest];
    for (const d of p.pool) {
      const at = restCopy.indexOf(d);
      const used = at === -1;
      if (!used) restCopy.splice(at, 1);
      pool.appendChild(tile("pool-chip" + (used ? " is-used" : ""), d));
    }
    pool.appendChild(tile("pool-label", "記号"));
    const opLeft = remainingOps();
    for (const o of OPS) {
      /*
       * 記号と残り回数は**別の字**にする。`+3` と1つに並べると「3を足す」に読める
       * （実機の見た目で確認）。記号を大きく、残りを小さく添える。
       */
      const chip = tile("pool-chip pool-chip--op" + (opLeft[o] === 0 ? " is-used" : ""), "");
      const g = document.createElement("span");
      g.textContent = glyph(o);
      const left = document.createElement("span");
      left.className = "pool-left";
      left.textContent = `のこり${opLeft[o]}`;
      chip.append(g, left);
      pool.appendChild(chip);
    }

    // 使える数・記号だけを押せるようにする。押してから弾かれるより、押せないほうが早い。
    for (const b of document.querySelectorAll("#row1 button, #row2 button")) {
      b.disabled = !rest.includes(b.dataset.value);
    }
    for (const b of document.querySelectorAll("#row3 button")) {
      b.disabled = opLeft[b.dataset.value] === 0;
    }
    $("next").textContent = index + 1 >= PUZZLES.length ? "さいしょへ" : "つぎの問題";
  }

  function edgeEl(e) {
    const m = moves[e];
    const el = document.createElement("div");
    el.className = "edge" + (m ? " is-filled" : "") + (e === selected ? " is-selected" : "");
    // 画面へ並べる順（格子を左上から走査）と道の番号は一致しない。番号を持たせておく。
    el.dataset.edge = String(e);
    const op = m ? glyph(m.op) : (e === selected && pendingOp ? glyph(pendingOp) : "");
    const num = m ? m.operand : "";
    const opEl = document.createElement("span");
    opEl.className = op ? "edge__op" : "edge__slot";
    opEl.textContent = op || "・";
    const numEl = document.createElement("span");
    numEl.className = num ? "edge__num" : "edge__slot";
    numEl.textContent = num || "・";
    el.append(opEl, numEl);
    el.addEventListener("click", () => { selected = e; pendingOp = null; render(); });
    return el;
  }

  function reject(text) {
    pendingOp = null;
    render();
    const plaza = $("plaza");
    plaza.classList.add("nect-rejected");
    setMsg(text, true);
    setTimeout(() => plaza.classList.remove("nect-rejected"), 300);
  }

  function setMsg(text, warn) {
    const el = $("msg");
    el.textContent = text;
    el.className = "nect-msg" + (warn ? " nect-msg--warn" : "");
  }

  function place(kind, value) {
    if (kind === "op") { pendingOp = value; render(); return; }
    if (pendingOp === null) { setMsg("さきに記号をえらぶ", true); return; }

    /*
     * **その場で分かる範囲だけを弾く。**
     *
     * 「どの解にも合わないから」という理由で拒むのはやめる。それをやると、押して
     * 弾かれるのを繰り返すだけで正解に辿り着けてしまい、総当たりがまた最適戦略に
     * なる（試作1で潰したはずの問題が別の形で戻る）。
     *
     * 弾くのは、盤面を見れば人にも分かる2つだけ。
     *   1. その手では1〜9からはみ出す（割り切れないを含む）
     *   2. できる駅の数が、すでに別の駅で使われている（1〜9をひとつずつ）
     */
    const known = stationValues();
    const [a, b] = edgesOf(puzzle())[selected];
    if (known[a] !== null) {
      const to = STEPS[`${known[a]}|${pendingOp}|${value}`];
      if (to === undefined) { reject("その手では1〜9からはみ出す"); return; }
      if (known[b] === null && known.includes(to)) { reject(`${to}の駅はもうある`); return; }
      if (known[b] !== null && to !== known[b]) { reject("その手では先の駅に合わない"); return; }
    }

    moves[selected] = { op: pendingOp, operand: value };
    pendingOp = null;
    const nextEmpty = moves.findIndex((m) => m === null);
    if (nextEmpty !== -1) selected = nextEmpty;
    render();
    $("plaza").classList.add("nect-connected");
    setTimeout(() => $("plaza").classList.remove("nect-connected"), 500);

    if (moves.every(Boolean)) finish();
    else setMsg("繋がった", false);
  }

  /**
   * 全部置けたかを確かめる。**答えは一意**（解答器が強制される手だけで解けた問題しか
   * 出していない）ので、生成器が渡した解と突き合わせるだけ。ここでも計算はしない。
   */
  function finish() {
    const p = puzzle();
    const ok = p.edges.every((e, i) => moves[i].op === e.op && moves[i].operand === e.operand);
    setMsg(ok ? "ぜんぶ繋がった" : "どこかの道が合っていない", !ok);
  }

  const fill = (row, list, kind) => {
    for (const c of list) {
      const b = document.createElement("button");
      b.textContent = glyph(c);
      b.dataset.value = c;
      b.addEventListener("click", () => place(kind, c));
      row.appendChild(b);
    }
  };
  fill($("row1"), ["1", "2", "3", "4", "5"], "num");
  fill($("row2"), ["6", "7", "8", "9"], "num");
  fill($("row3"), OPS, "op");

  $("clear").addEventListener("click", () => {
    /*
     * 選んでいる道だけを消す。全部やり直させない（数独で1マス消すのと同じ感覚）。
     *
     * 試作3には「全部埋まっている時はまとめて消す」という例外があった。3〜4手の
     * 盤面ではそれでよかったが、**12本では置き違いが1本あるだけで全部消える**。
     * 直したい1本を選んで消せることのほうが大事なので、例外を外した。
     * まとめて消したい時は、まだ空いている道を選んでから押す。
     */
    if (!moves[selected]) moves = new Array(edgesOf(puzzle()).length).fill(null);
    else moves[selected] = null;
    const empty = moves.findIndex((m) => m === null);
    selected = empty === -1 ? 0 : empty;
    pendingOp = null;
    setMsg("", false);
    render();
  });

  function load(i) {
    index = i;
    moves = new Array(edgesOf(puzzle()).length).fill(null);
    selected = 0;
    pendingOp = null;
    setMsg("", false);
    render();
  }
  $("next").addEventListener("click", () => load((index + 1) % PUZZLES.length));

  if (PUZZLES.length === 0) $("msg").textContent = "問題データが読み込めていません（plaza-puzzles.js）";
  else load(0);
})();
</script>
</body>
</html>
