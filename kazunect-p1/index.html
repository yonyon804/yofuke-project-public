<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カズネクト 試作2（交差）</title>
<!--
  カズネクト 試作2 — 交差型

  試作1（一本の式）は総当たりが最適戦略になっていた。ようすけさん判定
  「+-+×を順番にやっていく総当たりは作業であって面白くはない」。
  1つのマスを縦と横の両方の式に属させ、総当たりを割に合わなくする。

  確かめたいのは1点だけ。**推理して繋ぐのが面白いか。**
  章・セーブ・称号・音・ネクトの演出は入れない。面白くなかった時に
  「演出のせいかもしれない」という言い訳を残さないため。

  正解判定はこの画面に無い。生成器が作った対応表を引くだけ。
  同じ計算規則を画面側にもう一度書くと片方だけ直されてズレる（INC-2026-08-13-005）。

  見た目は `_nect-shared/nect.css`（コトネクトのアートディレクションを共通層へ切り出したもの）。
-->
<!-- 制作時は共通層を直接読む。公開時だけ配信用の複製を同じ階層へ置く（AGENTS §4-2 の原版と配信用実体）。 -->
<link rel="stylesheet" href="nect.css">
<style>
  /* 盤面。5×5のうち、横1行と縦1列だけにマスが載る。 */
  .board {
    display: grid;
    grid-template-columns: repeat(5, var(--cell));
    grid-template-rows: repeat(5, var(--cell));
    gap: 0.35rem;
    --cell: clamp(2.4rem, 15vw, 3.5rem);
  }
  .board .nect-tile { width: var(--cell); height: var(--cell); font-size: clamp(1.1rem, 6vw, 1.7rem); }
  .board .slot-empty { width: var(--cell); height: var(--cell); }

  /* 交差マス。2つの式が通る場所であることを、常時わかるようにしておく。 */
  .is-cross { box-shadow: var(--glow-soft), var(--bevel); }

  .found-list {
    display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; justify-content: center;
    font-size: var(--fs-aux); color: var(--dim); min-height: 1.2em;
  }
</style>
</head>
<body>
<div class="nect-app">
  <header class="nect-header">
    <span id="progress"></span>
    <span id="band"></span>
  </header>

  <main class="nect-stage">
    <div class="board" id="board"></div>
    <div class="nect-pips" id="pips"></div>
    <div class="nect-msg" id="msg"></div>
    <div class="found-list" id="foundList"></div>
    <p class="nect-note">たての式とよこの式が、まん中のマスで繋がっている</p>
  </main>

  <div class="nect-pad">
    <div class="nect-pad__row" id="row1"></div>
    <div class="nect-pad__row" id="row2"></div>
    <div class="nect-pad__row nect-pad__row--ops" id="row3"></div>
  </div>
  <div class="nect-actions">
    <button id="clear">とりけし</button>
    <button id="next" class="is-primary">つぎの問題</button>
  </div>
</div>

<script src="cross-puzzles.js"></script>
<script>
(function () {
  "use strict";
  const PUZZLES = window.KAZUNECT_PUZZLES || [];
  const $ = (id) => document.getElementById(id);

  let index = 0;
  let cells = {};      // "行,列" → トークン
  let blanks = [];      // 空欄のキー
  let selected = 0;
  let found = [];

  const puzzle = () => PUZZLES[index];
  const isOp = (t) => ["+", "-", "×", "÷"].includes(t);

  /*
   * 表示だけの置き換え。データは "-" のまま扱う（対応表のキーが変わると判定が壊れる）。
   * 半角ハイフンは他の記号より細く短く、`+ × ÷ =` と並ぶと1つだけ弱く見える。
   */
  const glyph = (t) => (t === "-" ? "\u2212" : t);

  /** 実際にマスがある範囲だけを描く。5×5のまま描くと、空マスのぶん盤面が片側へ寄る。 */
  function bounds(cells) {
    const rows = [], cols = [];
    for (const k of Object.keys(cells)) {
      const [r, c] = k.split(",").map(Number);
      rows.push(r); cols.push(c);
    }
    return { r0: Math.min(...rows), r1: Math.max(...rows), c0: Math.min(...cols), c1: Math.max(...cols) };
  }

  function load(i) {
    index = i;
    const p = puzzle();
    cells = { ...p.cells };
    blanks = p.blanks.slice();
    selected = 0;
    found = [];
    setMsg("", false);
    render();
  }

  function setMsg(text, warn) {
    const el = $("msg");
    el.textContent = text;
    el.className = "nect-msg" + (warn ? " nect-msg--warn" : "");
  }

  function render() {
    const p = puzzle();
    $("progress").textContent = `問題 ${index + 1} / ${PUZZLES.length}`;
    $("band").textContent = p.band;

    const board = $("board");
    board.innerHTML = "";
    const b = bounds(p.cells);
    board.style.gridTemplateColumns = `repeat(${b.c1 - b.c0 + 1}, var(--cell))`;
    board.style.gridTemplateRows = `repeat(${b.r1 - b.r0 + 1}, var(--cell))`;
    for (let r = b.r0; r <= b.r1; r++) {
      for (let c = b.c0; c <= b.c1; c++) {
        const key = `${r},${c}`;
        const t = cells[key];
        if (t === undefined) {
          const gap = document.createElement("div");
          gap.className = "slot-empty";
          board.appendChild(gap);
          continue;
        }
        const el = document.createElement("div");
        const blankAt = blanks.indexOf(key);
        const cross = r === p.ri && c === p.ci;
        if (blankAt !== -1) {
          el.className = "nect-tile nect-tile--blank"
            + (t !== "_" ? " is-filled" : "")
            + (blankAt === selected ? " is-selected" : "")
            + (cross ? " is-cross" : "");
          el.textContent = t === "_" ? "" : glyph(t);
          el.addEventListener("click", () => { selected = blankAt; render(); });
        } else {
          el.className = "nect-tile nect-tile--fixed" + (isOp(t) || t === "=" ? " nect-tile--op" : "");
          el.textContent = glyph(t);
        }
        board.appendChild(el);
      }
    }

    const pips = $("pips");
    pips.innerHTML = "";
    for (let k = 0; k < p.solutions.length; k++) {
      const pip = document.createElement("div");
      pip.className = "nect-pip" + (found.includes(k) ? " is-on" : "");
      pips.appendChild(pip);
    }

    $("foundList").innerHTML = found.map((k) => {
      const s = p.solutions[k];
      const h = [0, 1, 2, 3, 4].map((n) => glyph(s[`${p.ri},${n}`])).join("");
      const v = [0, 1, 2, 3, 4].map((n) => glyph(s[`${n},${p.ci}`])).join("");
      return `<span>${h}／${v}</span>`;
    }).join("");

    $("next").textContent = index + 1 >= PUZZLES.length ? "さいしょへ" : "つぎの問題";
  }

  function place(choice) {
    if (blanks.length === 0) return;
    cells[blanks[selected]] = choice;
    const nextEmpty = blanks.findIndex((k) => cells[k] === "_");
    if (nextEmpty !== -1) selected = nextEmpty;
    render();
    if (blanks.every((k) => cells[k] !== "_")) check();
  }

  function check() {
    const p = puzzle();
    const key = blanks.map((k) => cells[k]).join(" ");
    const hit = p.accepted[key];
    const board = $("board");

    if (hit === undefined) {
      board.classList.add("nect-rejected");
      setMsg("まだ噛み合わない", true);
      setTimeout(() => board.classList.remove("nect-rejected"), 300);
      return;
    }
    if (found.includes(hit)) {
      setMsg("それはもう見つけた繋ぎ方", true);
      return;
    }

    found.push(hit);
    render();
    $("board").classList.add("nect-connected");
    const left = p.solutions.length - found.length;
    setMsg(left === 0 ? "ぜんぶ繋がった" : `繋がった　のこり ${left} 通り`, false);

    setTimeout(() => {
      $("board").classList.remove("nect-connected");
      if (left > 0) clearBlanks();
    }, 700);
  }

  function clearBlanks() {
    blanks.forEach((k) => { cells[k] = "_"; });
    selected = 0;
    render();
  }

  const fill = (row, list) => {
    list.forEach((c) => {
      const b = document.createElement("button");
      b.textContent = glyph(c);
      b.addEventListener("click", () => place(c));
      row.appendChild(b);
    });
  };
  fill($("row1"), ["1", "2", "3", "4", "5"]);
  fill($("row2"), ["6", "7", "8", "9"]);
  fill($("row3"), ["+", "-", "×", "÷", "="]);

  $("clear").addEventListener("click", () => { clearBlanks(); setMsg("", false); });
  $("next").addEventListener("click", () => load((index + 1) % PUZZLES.length));

  if (PUZZLES.length === 0) {
    $("msg").textContent = "問題データが読み込めていません（cross-puzzles.js）";
  } else {
    load(0);
  }
})();
</script>
</body>
</html>
