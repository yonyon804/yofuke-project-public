name: Main guard

# main に着いた commit が、マージ済みのPRを経ているかを見る（`AGENTS.md` §5）。
#
# 阻止する経路（Claude Code の hook・Cowork面の印・git の pre-push）は全部 `git push` より
# 前に効き、**git を通らない書き込み（GitHub API・Web編集）を1本も見ない。** GitHub側の
# ブランチ保護は個人プランでは効かない（`BRANCH_PROTECTION_SETUP.md`）。ここは着いた後に
# 赤くする検知で、**面にも clone にも依存しない唯一の層。** 何を・どう判定するかは
# `tools/check_main_push_origin.py` の冒頭を正とする。
#
# 通常は緑で無音。直push の時だけ赤くなり、その1通が届く——それは望んだ信号。

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_main_push_origin.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
