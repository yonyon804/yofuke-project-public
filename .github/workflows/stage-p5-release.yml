name: Stage Kotonect Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage-p5-release.yml"
  push:
    branches:
      - publish/p5-kotonect-20260725
    paths:
      - ".github/workflows/stage-p5-release.yml"

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/p5-kotonect-20260725
      - name: Download verified release artifact
        env:
          RELEASE_ARTIFACT_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-f9a4-822f-b4fe-e98601950105/raw?se=2026-07-25T15:16:38Z&sp=r&sv=2026-02-06&sr=b&scid=34e835cf-ba49-4691-a186-21b87295e6a8&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-25T08:03:05Z&ske=2026-07-27T08:03:05Z&sks=b&skv=2026-02-06&sig=LlEzBA8ynwYTdw2TQH3xmgI4s4Q/pJmUWcM%2BOcJ1yyU%3D'
        run: |
          curl --fail --location --silent --show-error "$RELEASE_ARTIFACT_URL" -o /tmp/p5-release.zip
          mkdir -p /tmp/p5-release
          unzip -q /tmp/p5-release.zip -d /tmp/p5-release
      - name: Replace the two public editions
        run: |
          rm -rf preview-p5-kana preview-p5-kana-dev
          cp -a /tmp/p5-release/preview-p5-kana .
          cp -a /tmp/p5-release/preview-p5-kana-dev .
      - name: Commit verified static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-p5-kana preview-p5-kana-dev
          git commit -m "publish(p5): stage Kotonect release [release built]"
          git push origin HEAD:publish/p5-kotonect-20260725
